<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" fill="none">
  <defs>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D595"/>
      <stop offset="25%" stop-color="#D8C37B"/>
      <stop offset="50%" stop-color="#FFF2CE"/>
      <stop offset="75%" stop-color="#D8C37B"/>
      <stop offset="100%" stop-color="#B89F54"/>
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C98AA3"/>
      <stop offset="100%" stop-color="#E7B8C4"/>
    </linearGradient>
  </defs>

  <!-- Outer Fine Ornamental Frame with Moodboard Scalloped Arch -->
  <path d="
    M 30,720
    L 30,220
    C 30,170 60,110 110,80
    C 145,60 190,45 220,52
    C 235,56 244,65 250,72
    C 256,65 265,56 280,52
    C 310,45 355,60 390,80
    C 440,110 470,170 470,220
    L 470,720
    C 470,726 466,730 460,730
    L 40,730
    C 34,730 30,726 30,720 Z"
    stroke="url(#goldShine)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
  />

  <!-- Inner Delicate Hairline Arch -->
  <path d="
    M 42,714
    L 42,224
    C 42,178 70,122 116,94
    C 150,74 190,60 218,66
    C 232,69 243,80 250,86
    C 257,80 268,69 282,66
    C 310,60 350,74 384,94
    C 430,122 458,178 458,224
    L 458,714
    C 458,718 454,722 450,722
    L 50,722
    C 46,722 42,718 42,714 Z"
    stroke="url(#goldShine)" stroke-width="1" stroke-dasharray="4 3" opacity="0.85"
  />

  <!-- Top Center Ornamental Crest Flourish -->
  <g transform="translate(250, 68)">
    <circle cx="0" cy="-22" r="5" fill="url(#goldShine)"/>
    <circle cx="0" cy="-22" r="2.5" fill="#FAF6F0"/>
    <path d="M-24 -12 C -12 -28, 12 -28, 24 -12 C 16 -6, 8 -16, 0 -8 C -8 -16, -16 -6, -24 -12 Z" fill="url(#goldShine)"/>
    <path d="M-14 -6 C -6 -14, 6 -14, 14 -6" stroke="url(#goldShine)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Corner Ornamental Rosettes (Bottom Left & Right) -->
  <g transform="translate(36, 724)">
    <circle cx="0" cy="0" r="3.5" fill="url(#goldShine)"/>
    <path d="M 0,-14 C 6,-6, 12,0, 18,0 M 0,0 C 0,-6, 6,-12, 14,-14" stroke="url(#goldShine)" stroke-width="1.2" fill="none"/>
  </g>
  <g transform="translate(464, 724)">
    <circle cx="0" cy="0" r="3.5" fill="url(#goldShine)"/>
    <path d="M 0,-14 C -6,-6, -12,0, -18,0 M 0,0 C 0,-6, -6,-12, -14,-14" stroke="url(#goldShine)" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Spring Floral Vine Dots Along Arch Shoulders -->
  <circle cx="112" cy="84" r="2.5" fill="#C98AA3" opacity="0.75"/>
  <circle cx="388" cy="84" r="2.5" fill="#C98AA3" opacity="0.75"/>
  <circle cx="68" cy="138" r="2" fill="#D8C37B"/>
  <circle cx="432" cy="138" r="2" fill="#D8C37B"/>
</svg>